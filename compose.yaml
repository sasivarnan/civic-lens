name: civiclens
services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiclens}
      POSTGRES_DB: civiclens
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens -d civiclens"]
      interval: 5s
      timeout: 3s
      retries: 20
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: civiclens
    ports: ["127.0.0.1:3900:3900"]
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres-data:
  garage-data:
